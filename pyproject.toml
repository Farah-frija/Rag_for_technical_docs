[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manual-rag"
version = "2.0.0"
description = "Production-oriented RAG stack for long technical manuals (PDF -> hierarchical index -> pluggable retrieval)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "google-genai>=0.3",
    "requests>=2.31",
    "langgraph>=0.2",
    "langgraph-checkpoint>=1.0",
    "sentence-transformers>=3.0",
    "transformers>=4.40",
    "torch>=2.2",
    "rank-bm25>=0.2.2",
    "chromadb>=0.5",
    "pandas>=2.2",
]

[project.optional-dependencies]
viewer = ["streamlit>=1.35"]
dev = ["pytest>=8.0"]

[project.scripts]
manual-rag = "manual_rag.cli:main"

[tool.setuptools.packages.find]
include = ["manual_rag*"]
